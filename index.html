<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeepSeek AI 3D 模型展示</title>
    <style>
        body { margin: 0; background-color: #f0f2f5; display: flex; flex-direction: column; align-items: center; font-family: sans-serif; }
        model-viewer { width: 100vw; height: 85vh; background-color: #ffffff; }
        .footer { margin-top: 10px; color: #666; font-size: 14px; }
    </style>
    <script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.4.0/dist/model-viewer.min.js"></script>
</head>
<body>
    <model-viewer 
        src="./deepseek.glb" 
        alt="DeepSeek 3D 模型" 
        camera-controls 
        auto-rotate 
        shadow-intensity="1">
    </model-viewer>
    <div class="footer">按住鼠标左键拖动可旋转，滚轮可缩放</div>
</body>
</html>
